name: Harness deterministic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness-deterministic:
    name: harness-deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic challenge boundary
        run: |
          set -euo pipefail
          idea_file="${RUNNER_TEMP}/agentcofounder-harness-idea.txt"
          printf '%s\n' 'Build a tiny notes app with a deterministic health check.' > "$idea_file"
          npm run challenge -- --idea-file "$idea_file"
